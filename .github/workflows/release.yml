name: Release 3X-UI

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  XRAY_VERSION: v26.7.28
  MTG_MULTI_VERSION: v1.14.0

jobs:
  build-linux-amd64:
    name: Build Linux amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools file unzip

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Type-check frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Build static Linux amd64 binary
        env:
          CGO_ENABLED: "1"
          GOOS: linux
          GOARCH: amd64
          CC: musl-gcc
        run: |
          set -euo pipefail
          go build \
            -trimpath \
            -ldflags "-w -s -linkmode external -extldflags '-static'" \
            -o xui-release \
            main.go
          file xui-release
          file xui-release | grep -qi "statically linked"

      - name: Assemble release package
        run: |
          set -euo pipefail

          retry_download() {
            local output="$1"
            local url="$2"
            curl --fail --location --silent --show-error \
              --retry 5 --retry-all-errors --retry-delay 3 \
              --output "$output" "$url"
          }

          optional_download() {
            local output="$1"
            local url="$2"
            if ! retry_download "$output" "$url"; then
              echo "Optional asset unavailable: $url" >&2
              rm -f "$output"
            fi
          }

          rm -rf x-ui
          mkdir -p x-ui/bin
          install -m 0755 xui-release x-ui/x-ui
          install -m 0644 x-ui.service.debian x-ui/
          install -m 0644 x-ui.service.arch x-ui/
          install -m 0644 x-ui.service.rhel x-ui/
          install -m 0755 x-ui.sh x-ui/

          pushd x-ui/bin >/dev/null

          retry_download Xray-linux-64.zip \
            "https://github.com/XTLS/Xray-core/releases/download/${XRAY_VERSION}/Xray-linux-64.zip"
          unzip -q Xray-linux-64.zip
          rm -f Xray-linux-64.zip geoip.dat geosite.dat
          mv xray xray-linux-amd64

          retry_download geoip.dat \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geoip.dat"
          retry_download geosite.dat \
            "https://github.com/Loyalsoldier/v2ray-rules-dat/releases/latest/download/geosite.dat"

          optional_download geoip_IR.dat \
            "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geoip.dat"
          optional_download geosite_IR.dat \
            "https://github.com/chocolate4u/Iran-v2ray-rules/releases/latest/download/geosite.dat"
          optional_download geoip_RU.dat \
            "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geoip.dat"
          optional_download geosite_RU.dat \
            "https://github.com/runetfreedom/russia-v2ray-rules-dat/releases/latest/download/geosite.dat"

          MTG_PACKAGE="mtg-multi-${MTG_MULTI_VERSION#v}-linux-amd64"
          if retry_download "${MTG_PACKAGE}.tar.gz" \
            "https://github.com/mhsanaei/mtg-multi/releases/download/${MTG_MULTI_VERSION}/${MTG_PACKAGE}.tar.gz"; then
            tar -xzf "${MTG_PACKAGE}.tar.gz"
            install -m 0755 "${MTG_PACKAGE}/mtg-multi" mtg-linux-amd64
            rm -rf "${MTG_PACKAGE}" "${MTG_PACKAGE}.tar.gz"
          else
            echo "Optional mtg-multi sidecar was not packaged." >&2
            rm -f "${MTG_PACKAGE}.tar.gz"
          fi

          test -x xray-linux-amd64
          test -s geoip.dat
          test -s geosite.dat
          popd >/dev/null

          tar -czf x-ui-linux-amd64.tar.gz x-ui
          tar -tzf x-ui-linux-amd64.tar.gz >/dev/null
          sha256sum x-ui-linux-amd64.tar.gz > x-ui-linux-amd64.tar.gz.sha256

      - name: Upload verified package
        uses: actions/upload-artifact@v4
        with:
          name: x-ui-linux-amd64
          path: |
            x-ui-linux-amd64.tar.gz
            x-ui-linux-amd64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish verified release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build-linux-amd64
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Download verified package
        uses: actions/download-artifact@v4
        with:
          name: x-ui-linux-amd64
          path: release-assets

      - name: Verify downloaded package
        run: |
          set -euo pipefail
          cd release-assets
          sha256sum -c x-ui-linux-amd64.tar.gz.sha256
          tar -tzf x-ui-linux-amd64.tar.gz >/dev/null

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
          else
            gh release create "$TAG" release-assets/* \
              --title "$TAG" \
              --generate-notes \
              --latest
          fi
